<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Climate Control</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌡️</text></svg>">
		<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
		<link rel="stylesheet" href="https://code.jquery.com/ui/1.14.2/themes/overcast/jquery-ui.css">
		<script src="https://code.jquery.com/ui/1.14.2/jquery-ui.min.js"></script>

		<script src="https://cdn.plot.ly/plotly-4.1.2.min.js" type="text/javascript"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/luxon/3.7.2/luxon.min.js" type="text/javascript"></script>
		<script src="scripts/main.mjs" type="module"></script>
		<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.10.0/css/all.css">
		<link rel="stylesheet" href="css/style.css" type="text/css"/>
	</head>
	<body>
		<div id="chart"></div>
		<div id="table"></div>
		<div id="loading" role="status"><i class="fas fa-spinner fa-spin"></i> Loading</div>
		<div class="top-left">
			<button type="button" class="touch-button" id="legend-touch" title="Series" aria-label="Series">
				<i class="fas fa-list"></i>
			</button>
		</div>
		<div class="top-right">
			<label for="occup-touch" title="Only show room temperatures while occupied" aria-label="Only show room temperatures while occupied"><i class="fas fa-users"></i></label>
			<input type="checkbox" name="occup-touch" id="occup-touch" value='active'>
			<button type="button" class="touch-button" id="table-touch" title="Show table" aria-label="Show table">
				<i class="fas fa-table"></i>
			</button>
			<button type="button" class="touch-button" id="config-touch" title="Dates and thermostat" aria-label="Dates and thermostat">
				<i class="fas fa-calendar-alt"></i>
			</button>
		</div>
		<div id="dialog">
			<div id="dialog-config" class="dialog-hidden">
				<fieldset class="dialog-right">
					<legend>Interval</legend>
					<label for="interval-minute">5 Minute
						<input type="radio" name="interval" id="interval-minute" value="minute">
					</label>
					<label for="interval-hourly">Hourly
						<input type="radio" name="interval" id="interval-hourly" value="hourly">
					</label>
					<label for="interval-daily">Daily
						<input type="radio" name="interval" id="interval-daily" value="daily">
					</label>
				</fieldset>
				<div class="dialog-section">
					Start Date:<br/>
					<input type="input" id="startdate" class="datepicker">
				</div>
				<div class="dialog-section">
					End Date:<br/>
					<input type="input" id="enddate" class="datepicker">
				</div>
				<div class="dialog-section">
					Thermostat:<br/>
					<select name="thermostats" id="thermostats">
						<option value="1">Thermostat 1</option>
						<option value="2">Thermostat 2</option>
					</select>
				</div>
				<div class="dialog-section">
					Quick Links:<br/>
					<input type="button" class="config-fixed-time" id="config-today" value="Today">
					<input type="button" class="config-fixed-time" id="config-24-hours" value="24 Hours">
					<input type="button" class="config-fixed-time" id="config-yesterday" value="Yesterday">
					<input type="button" class="config-fixed-time" id="config-yesterday-today" value="Yesterday + Today">
					<input type="button" class="config-fixed-time" id="config-7-days" value="7 Days">
					<input type="button" class="config-fixed-time" id="config-30-days" value="30 Days">
				</div>
				<div>
					<input type="button" id="config-update" value="Update" class="dialog-right">
				</div>
			</div>
			<div id="dialog-error" class="dialog-hidden">
			</div>
			<div id="dialog-legend" class="dialog-hidden">
			</div>
		</div>
	</body>
</html>
